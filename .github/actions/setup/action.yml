name: Setup
description: Install Node (from .node-version), pnpm (from packageManager), and dependencies.

inputs:
  cache:
    description: Whether to cache the pnpm store. Release jobs turn it off to avoid cache poisoning.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache == 'true' }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
